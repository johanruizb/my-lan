    M 270 74 L 290 74 L 310 134 L 330 74 L 350 74 L 350 184 L 330 184 L 330 110 L 318 146 L 302 146 L 290 110 L 290 184 L 270 184 Z
  " />
  
  <!-- Letter y (x: 364..420, width 56, gap 14) -->
